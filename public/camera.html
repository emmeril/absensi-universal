<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12372a" />
    <title>Kamera Absensi | Ruang Hadir</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet" />
    <script defer src="/universal-copy.js"></script>
    <style>
      :root { --forest: #12372a; --leaf: #2f6b4f; --lime: #d9f99d; --ink: #17211b; --paper: rgba(255, 255, 255, .82); }
      [hidden] { display: none !important; }
      body { min-height: 100vh; margin: 0; color: var(--ink); font-family: "Trebuchet MS", sans-serif; background: radial-gradient(circle at 90% 5%, var(--lime) 0, transparent 30%), linear-gradient(145deg, #f8f4e9, #dfeadd); }
      .page-shell { min-height: 100vh; max-width: 1140px; padding-top: calc(1.5rem + env(safe-area-inset-top)); padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); }
      .stage { width: 100%; }
      .page-header { margin-bottom: clamp(1.75rem, 4vw, 3.5rem); }
      .brand { font-size: 1.25rem; font-weight: 900; letter-spacing: -.03em; }
      .type-badge { border: 1px solid rgba(18, 55, 42, .25); background: rgba(255, 255, 255, .6); font-size: .6875rem; font-weight: 900; letter-spacing: .12em; }
      .eyebrow { color: var(--leaf); font-size: .75rem; font-weight: 900; letter-spacing: .2em; }
      .hero-title { font-size: clamp(2.5rem, 7vw, 4.5rem); font-weight: 900; line-height: .95; letter-spacing: -.05em; }
      .hero-copy { max-width: 30rem; }
      .camera-panel { width: 100%; max-width: 31rem; margin-inline: auto; padding: clamp(.75rem, 2vw, 1rem); border: 1px solid rgba(18, 55, 42, .14); border-radius: 32px 32px 12px 32px; background: var(--paper); box-shadow: 0 1.5rem 4rem rgba(18, 55, 42, .14); backdrop-filter: blur(12px); }
      .camera-frame { position: relative; width: 100%; max-height: 62vh; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 24px 24px 8px 24px; background: #07130e; }
      .camera-media { width: 100%; height: 100%; object-fit: cover; }
      video.camera-media { transform: scaleX(-1); }
      .face-guide { pointer-events: none; position: absolute; inset: 12% 16%; border: 2px dashed rgba(217, 249, 157, .8); border-radius: 48% 48% 44% 44%; box-shadow: 0 0 0 999px rgba(6, 20, 13, .24); }
      .live-label { position: absolute; top: .875rem; left: .875rem; color: #fff; background: rgba(7, 19, 14, .74); font-size: .625rem; font-weight: 900; letter-spacing: .12em; }
      .status-box { min-height: 3rem; border-left: 4px solid var(--leaf); border-radius: 4px 12px 12px 4px; background: rgba(18, 55, 42, .07); font-size: .875rem; font-weight: 700; line-height: 1.35rem; }
      .btn-forest { --bs-btn-bg: var(--forest); --bs-btn-border-color: var(--forest); --bs-btn-hover-bg: #0b291f; --bs-btn-hover-border-color: #0b291f; --bs-btn-disabled-bg: var(--forest); --bs-btn-disabled-border-color: var(--forest); color: #fff; font-weight: 900; min-height: 3.25rem; }
      .btn-outline-forest { --bs-btn-color: var(--forest); --bs-btn-border-color: rgba(18, 55, 42, .3); --bs-btn-hover-bg: var(--forest); --bs-btn-hover-border-color: var(--forest); font-weight: 900; min-height: 3.25rem; background: rgba(255, 255, 255, .7); }
      .btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; box-shadow: none; }
      .success-card { width: min(100%, 36rem); border: 1px solid rgba(18, 55, 42, .18); border-radius: 8px 36px 36px 36px; background: rgba(255, 255, 255, .78); box-shadow: 0 1.5rem 4rem rgba(18, 55, 42, .14); }
      .success-icon { width: 5.5rem; height: 5.5rem; color: #fff; background: var(--forest); font-size: 3rem; font-weight: 900; box-shadow: 0 .75rem 2rem rgba(18, 55, 42, .25); }
      @media (max-width: 991.98px) { .page-shell { max-width: 38rem; } .page-header { margin-bottom: 1.5rem; } .hero-copy { text-align: center; margin-inline: auto; } .camera-frame { max-height: 56vh; } }
      @media (max-width: 575.98px) { .page-shell { padding-inline: 1rem; } .camera-panel { border-radius: 24px 24px 8px 24px; } .camera-frame { max-height: 52vh; border-radius: 18px 18px 6px 18px; } .hero-title { font-size: clamp(2.35rem, 13vw, 3.25rem); } }
    </style>
  </head>
  <body>
    <main class="container page-shell d-flex align-items-center px-3 px-sm-4">
      <div class="stage" id="attendanceStage">
        <header class="page-header d-flex align-items-center justify-content-between gap-3">
          <div class="brand">Ruang Hadir</div>
          <div class="type-badge rounded-pill px-3 py-2 text-uppercase" id="typeBadge">Absensi</div>
        </header>
        <div class="row align-items-center g-4 g-lg-5">
          <section class="col-lg-5 hero-copy">
            <p class="eyebrow mb-3 text-uppercase">Verifikasi kehadiran</p>
            <h1 class="hero-title" id="title">Siapkan wajahmu.</h1>
            <p class="mt-3 mb-0 text-secondary lh-lg" id="lead">Foto harus diambil sekarang menggunakan kamera depan.</p>
          </section>
          <div class="col-lg-7">
            <section class="camera-panel d-flex flex-column gap-3">
              <div class="camera-frame">
                <video class="camera-media" id="video" autoplay muted playsinline></video>
                <canvas class="camera-media" id="canvas" style="display: none"></canvas>
                <div class="face-guide" id="guide"></div>
                <div class="live-label rounded-pill px-3 py-2 text-uppercase">Kamera langsung</div>
              </div>
              <div class="status-box d-flex align-items-center px-3 py-2" id="status">Memeriksa tautan absensi...</div>
              <div class="row g-2">
                <div class="col-12"><button type="button" class="btn btn-forest w-100" id="capture" disabled>Ambil selfie</button></div>
                <div class="col-12 col-sm-6"><button type="button" class="btn btn-outline-forest w-100" id="retake" hidden>Foto ulang</button></div>
                <div class="col-12 col-sm-6"><button type="button" class="btn btn-forest w-100" id="submit" hidden>Kirim absensi</button></div>
              </div>
            </section>
          </div>
        </div>
      </div>
      <section class="success-card mx-auto p-4 p-sm-5 text-center" id="successStage" hidden>
        <div class="success-icon rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4" aria-hidden="true">&#10003;</div>
        <p class="eyebrow mb-3 text-uppercase">Absensi tercatat</p>
        <h1 class="hero-title">Berhasil.</h1>
        <p class="mt-4 mb-2 fs-5 fw-bold" id="successTitle">Absensi berhasil dicatat.</p>
        <p class="mb-0 text-secondary lh-lg" id="successDetail"></p>
        <p class="mt-4 mb-0 small text-secondary">Halaman ini sekarang boleh ditutup.</p>
      </section>
    </main>
    <script>
      const token = new URLSearchParams(location.search).get("token");
      const video = document.querySelector("#video");
      const canvas = document.querySelector("#canvas");
      const guide = document.querySelector("#guide");
      const statusBox = document.querySelector("#status");
      const captureButton = document.querySelector("#capture");
      const retakeButton = document.querySelector("#retake");
      const submitButton = document.querySelector("#submit");
      let stream;
      let locationData;
      let imageData;

      function setStatus(message, error = false) {
        statusBox.textContent = message;
        statusBox.classList.toggle("border-danger", error);
        statusBox.classList.toggle("text-danger", error);
      }

      function stopCamera() {
        if (stream) stream.getTracks().forEach((track) => track.stop());
      }

      async function startCamera() {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Kamera tidak tersedia. Buka tautan ini di Chrome/Safari melalui HTTPS.");
        }
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: { ideal: 720 }, height: { ideal: 960 } },
            audio: false,
          });
          video.srcObject = stream;
          await video.play();
        } catch (error) {
          if (error.name === "NotAllowedError") {
            throw new Error("Akses kamera ditolak. Izinkan kamera di pengaturan browser lalu muat ulang halaman.");
          }
          if (error.name === "NotFoundError") throw new Error("Kamera depan tidak ditemukan di perangkat ini.");
          throw new Error("Kamera tidak dapat dibuka. Tutup aplikasi lain yang memakai kamera lalu muat ulang.");
        }
      }

      function getLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error("GPS tidak didukung perangkat ini."));
          navigator.geolocation.getCurrentPosition(
            (position) => resolve({
              latitude: position.coords.latitude,
              longitude: position.coords.longitude,
              accuracy: position.coords.accuracy,
            }),
            () => reject(new Error("Lokasi tidak dapat dibaca. Izinkan GPS lalu muat ulang halaman.")),
            { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
          );
        });
      }

      async function initialize() {
        if (!token) throw new Error("Token absensi tidak ditemukan.");
        const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`);
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Tautan tidak berlaku.");
        document.querySelector("#typeBadge").textContent = `Absen ${data.tipe}`;
        document.querySelector("#title").textContent = `Halo, ${data.nama}.`;
        document.querySelector("#lead").textContent = `Ambil selfie langsung untuk absen ${data.tipe}. Tautan segera kedaluwarsa.`;
        if (!window.isSecureContext) throw new Error("Kamera membutuhkan alamat HTTPS. Hubungi admin untuk memperbaiki tautan bot.");
        setStatus("Izinkan akses kamera depan...");
        await startCamera();
        setStatus("Kamera siap. Sekarang izinkan lokasi GPS...");
        locationData = await getLocation();
        captureButton.disabled = false;
        setStatus(`Kamera dan GPS siap (akurasi ${Math.round(locationData.accuracy)} m). Posisikan wajah di dalam garis.`);
      }

      captureButton.addEventListener("click", () => {
        const width = video.videoWidth;
        const height = video.videoHeight;
        if (!width || !height) return setStatus("Kamera belum siap. Tunggu sebentar.", true);
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext("2d");
        context.translate(width, 0);
        context.scale(-1, 1);
        context.drawImage(video, 0, 0, width, height);
        imageData = canvas.toDataURL("image/jpeg", .86);
        video.hidden = true;
        canvas.style.display = "block";
        guide.hidden = true;
        captureButton.hidden = true;
        retakeButton.hidden = false;
        submitButton.hidden = false;
        setStatus("Periksa foto. Jika wajah terlihat jelas, kirim absensi.");
      });

      retakeButton.addEventListener("click", () => {
        imageData = null;
        canvas.style.display = "none";
        video.hidden = false;
        guide.hidden = false;
        captureButton.hidden = false;
        retakeButton.hidden = true;
        submitButton.hidden = true;
        setStatus("Posisikan wajah di dalam garis, lalu ambil selfie.");
      });

      submitButton.addEventListener("click", async () => {
        submitButton.disabled = true;
        retakeButton.disabled = true;
        setStatus("Memverifikasi wajah dan lokasi. Jangan tutup halaman...");
        try {
          locationData = await getLocation();
          const response = await fetch(`/api/attendance-camera/${encodeURIComponent(token)}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ image: imageData, ...locationData }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Absensi gagal diproses.");
          stopCamera();
          document.querySelector("#attendanceStage").hidden = true;
          document.querySelector("#successStage").hidden = false;
          document.querySelector("#successTitle").textContent = `Absen ${data.tipe} berhasil.`;
          document.querySelector("#successDetail").textContent = `Dicatat pukul ${data.waktu} dengan status ${data.status}.`;
        } catch (error) {
          setStatus(error.message, true);
          submitButton.hidden = true;
          retakeButton.hidden = true;
        }
      });

      window.addEventListener("pagehide", stopCamera);
      initialize().catch((error) => {
        setStatus(error.message || "Kamera tidak dapat dimulai.", true);
        captureButton.disabled = true;
      });
    </script>
  </body>
</html>
